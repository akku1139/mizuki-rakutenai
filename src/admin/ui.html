<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>瑞稀 管理パネル</title>
<style>
:root{--bg:#ffffff;--fg:#1e1e2e;--panel:#f5f5f5;--border:#d0d0d0;--accent:#1e66f5;--accent-fg:#ffffff;--ok:#40a02b;--warn:#df8e1d;--err:#d20f39;--muted:#6c6f85}
@media (prefers-color-scheme: dark){:root{--bg:#1e1e2e;--fg:#cdd6f4;--panel:#181825;--border:#313244;--accent:#89b4fa;--accent-fg:#1e1e2e;--ok:#a6e3a1;--warn:#f9e2af;--err:#f38ba8;--muted:#a6adc8}}
body{font-family:sans-serif;margin:0;background:var(--bg);color:var(--fg)}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:18px}
nav{display:flex;gap:8px}
nav button{background:var(--panel);color:var(--fg);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
main{padding:16px;max-width:1100px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{color:var(--accent)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--accent)}
.logs{font-family:monospace;font-size:12px;max-height:calc(100vh - 220px);min-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px;border:1px solid var(--border)}
.logs .error{color:var(--err)}.logs .warn{color:var(--warn)}.logs .info{color:var(--muted)}
</style>
</head>
<body>
<header><h1>瑞稀 管理パネル</h1><input id="token" placeholder="Bearer token" style="margin-left:auto" onchange="localStorage.token=this.value"><nav>
<button class="active" data-tab="status">ステータス</button>
<button data-tab="sync">同期</button>
<button data-tab="ai">AI 設定</button>
<button data-tab="logs">ログ</button>
<button data-tab="mcp">MCP</button>
<button data-tab="channels">チャンネル</button>
<button data-tab="jobs">ジョブ</button>
</nav></header>
<div id="statusbar" style="padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)"></div>
<main>
<section id="status"><div class="card"><h3>ランタイム</h3><div class="kv" id="runtime"></div></div><div class="card"><h3>会話一覧</h3><table id="sessions"><tr><th>キー</th><th>プロバイダ</th><th>ラベル</th></tr></table></div><div class="card"><h3>安価</h3><table id="ankas"><tr><th>target</th><th>count</th><th>channel</th><th>url</th></tr></table></div></section>
<section id="sync" hidden><div class="card"><h3>同期ペア</h3><table id="syncs"><tr><th>Discord ch</th><th>Fluxer ch</th></tr></table></div></section>
<section id="ai" hidden><div class="card"><h3>ユーザー別プロバイダ</h3><table id="prefs"><tr><th>ユーザー ID</th><th>プロバイダ</th></tr></table></div></section>
<section id="logs" hidden><div class="card"><h3>ログ</h3><div class="logs" id="logbox"></div></div></section>
<section id="mcp" hidden><div class="card"><h3>MCP サーバー</h3><table id="mcps"><tr><th>名前</th><th>状態</th><th>ツール数</th><th>操作</th></tr></table></div><div class="card"><h3>追加 / 編集</h3><div class="kv">
<dt>name</dt><dd><input id="m_name"></dd>
<dt>url</dt><dd><input id="m_url"></dd>
<dt>command</dt><dd><input id="m_cmd"></dd>
<dt>transport</dt><dd><select id="m_tr"><option>http</option><option>sse</option><option>stdio</option></select></dd>
<dt>headers (JSON)</dt><dd><textarea id="m_headers" rows="3" style="width:100%"></textarea></dd>
</div><button id="m_submit" onclick="addMcp()">追加</button> <button onclick="resetMcpForm()">クリア</button></div></section>
<section id="channels" hidden><div class="card"><h3>チャンネル一覧</h3><table id="channelsTable"><tr><th>プラットフォーム</th><th>チャンネル</th><th>ブラックリスト</th></tr></table></div></section>
<section id="jobs" hidden><div class="card"><h3>バックグラウンドジョブ</h3><div class="kv"><dt>type</dt><dd><input id="job_type" value="index"></dd><dt>channelId</dt><dd><input id="job_channel"></dd><dt>prompt (agent)</dt><dd><textarea id="job_prompt" rows="2" style="width:100%"></textarea></dd></div><button onclick="enqueueJob()">発行</button><table id="jobsTable"><tr><th>ID</th><th>type</th><th>channel</th><th>status</th><th>result</th></tr></table></div></section>
</main>
<script>
const tabs=document.querySelectorAll('nav button');
const sections=document.querySelectorAll('main section');
function showTab(name){if(!name)name='status';tabs.forEach(x=>x.classList.toggle('active',x.dataset.tab===name));sections.forEach(s=>s.hidden=s.id!==name);if(location.hash!=='#'+name)location.hash=name;}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
window.addEventListener('hashchange',()=>showTab((location.hash||'').replace('#','')));
showTab((location.hash||'').replace('#',''));
const tokenInput=document.getElementById('token');tokenInput.value=localStorage.token||'';tokenInput.onchange=()=>localStorage.token=tokenInput.value;
async function api(p){const r=await fetch(p,{headers:{'Authorization':'Bearer '+(localStorage.token||'')}});if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json();}
function row(t,cells){const tr=document.createElement('tr');cells.forEach(c=>{const td=document.createElement('td');td.textContent=c;tr.appendChild(td);});t.appendChild(tr);}
async function refresh(){
  const bar=document.getElementById('statusbar');
  try {
  const s=await api('/api/status');
  const rt=document.getElementById('runtime');rt.innerHTML='';
  [['待機ジョブ',s.waiting],['処理中ジョブ',s.processing],['会話数',s.sessions.length],['安価',s.ankas.length]].forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;rt.append(dt,dd);});
  const st=document.getElementById('sessions');st.innerHTML='<tr><th>キー</th><th>プロバイダ</th><th>ラベル</th></tr>';
  s.sessions.forEach(x=>row(st,[x.key,x.provider,x.label]));
  const ak=document.getElementById('ankas');ak.innerHTML='<tr><th>target</th><th>count</th><th>channel</th><th>url</th></tr>';
  s.ankas.forEach(x=>row(ak,[x.target,x.count,x.channelId,x.url]));
  const sy=await api('/api/sync');const syt=document.getElementById('syncs');syt.innerHTML='<tr><th>Discord ch</th><th>Fluxer ch</th></tr>';sy.forEach(x=>row(syt,[x.discordChannelId,x.fluxerChannelId]));
  const pr=await api('/api/ai-prefs');const prt=document.getElementById('prefs');prt.innerHTML='<tr><th>ユーザー ID</th><th>プロバイダ</th></tr>';Object.entries(pr).forEach(([k,v])=>row(prt,[k,v]));
  const lg=await api('/api/logs');const lb=document.getElementById('logbox');lb.innerHTML='';lg.forEach(e=>{const d=document.createElement('div');d.className=e.level;d.textContent=`[${new Date(e.ts).toLocaleTimeString()}] ${e.message}`;lb.appendChild(d);});
  const chs=await api('/api/channels');const cht=document.getElementById('channelsTable');cht.innerHTML='<tr><th>プラットフォーム</th><th>チャンネル</th><th>ブラックリスト</th></tr>';chs.forEach(x=>{const tr=document.createElement('tr');const td1=document.createElement('td');td1.textContent=x.platform;tr.appendChild(td1);const td2=document.createElement('td');td2.textContent=x.name;tr.appendChild(td2);const td3=document.createElement('td');const cb=document.createElement('input');cb.type='checkbox';cb.checked=x.blacklisted;cb.onchange=async()=>{await fetch('/api/blacklist',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.token||''),'Content-Type':'application/json'},body:JSON.stringify({channelId:x.id,blacklisted:cb.checked})});};td3.appendChild(cb);tr.appendChild(td3);cht.appendChild(tr);});
  const jobs=await api('/api/jobs');const jt=document.getElementById('jobsTable');jt.innerHTML='<tr><th>ID</th><th>type</th><th>channel</th><th>status</th><th>result</th></tr>';jobs.forEach(x=>{const tr=document.createElement('tr');[x.id,x.type,x.channelId,x.status,x.result||x.error||''].forEach(c=>{const td=document.createElement('td');td.textContent=c;tr.appendChild(td);});jt.appendChild(tr);});
  const mc=await api('/api/mcp');const mct=document.getElementById('mcps');mct.innerHTML='<tr><th>名前</th><th>状態</th><th>ツール数</th><th>操作</th></tr>';mc.forEach(x=>{const tr=document.createElement('tr');[x.name,x.status,x.toolCount].forEach(c=>{const td=document.createElement('td');td.textContent=c;tr.appendChild(td);});const td=document.createElement('td');
const cb=document.createElement('button');cb.textContent='接続';cb.onclick=()=>connectMcp(x.name);td.appendChild(cb);
if(x.oauthRequired){const ob=document.createElement('button');ob.textContent='認証';ob.onclick=async()=>{const r=await fetch('/api/mcp/oauth',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.token||''),'Content-Type':'application/json'},body:JSON.stringify({name:x.name})});const j=await r.json();if(j.url)window.open(j.url,'_blank');};td.appendChild(ob);}
const eb=document.createElement('button');eb.textContent='編集';eb.onclick=()=>{document.getElementById('m_name').value=x.name;document.getElementById('m_url').value=x.url||'';document.getElementById('m_cmd').value=x.command||'';document.getElementById('m_tr').value=x.transport||'http';document.getElementById('m_headers').value=x.headers?JSON.stringify(x.headers):'';document.getElementById('m_submit').textContent='更新';document.getElementById('m_name').readOnly=true;};td.appendChild(eb);
const db=document.createElement('button');db.textContent='削除';db.onclick=async()=>{await fetch('/api/mcp?name='+encodeURIComponent(x.name),{method:'DELETE',headers:{'Authorization':'Bearer '+(localStorage.token||'')}});refresh();};td.appendChild(db);
tr.appendChild(td);mct.appendChild(tr);});
  }catch(e){bar.textContent='Error: '+e.message;}
}
async function addMcp(){let headers;try{const v=document.getElementById('m_headers').value.trim();if(v)headers=JSON.parse(v);}catch(e){alert('headers JSON invalid');return;}const cfg={name:document.getElementById('m_name').value,url:document.getElementById('m_url').value||undefined,command:document.getElementById('m_cmd').value||undefined,transport:document.getElementById('m_tr').value,headers};await fetch('/api/mcp',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.token||''),'Content-Type':'application/json'},body:JSON.stringify(cfg)});resetMcpForm();refresh();}
function resetMcpForm(){document.getElementById('m_name').value='';document.getElementById('m_name').readOnly=false;document.getElementById('m_url').value='';document.getElementById('m_cmd').value='';document.getElementById('m_tr').value='http';document.getElementById('m_headers').value='';document.getElementById('m_submit').textContent='追加';}
async function connectMcp(name){await fetch('/api/mcp/connect',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.token||''),'Content-Type':'application/json'},body:JSON.stringify({name})});refresh();}
async function enqueueJob(){await fetch('/api/jobs',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.token||''),'Content-Type':'application/json'},body:JSON.stringify({type:document.getElementById('job_type').value,channelId:document.getElementById('job_channel').value,prompt:document.getElementById('job_prompt').value})});refresh();}
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
